[project]
name = "xingxuan-backend"
version = "0.1.0"
description = "星选建材 - 客户/询价/报价管理后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "weasyprint>=61",
    "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
